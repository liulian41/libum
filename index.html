    const minC = S.settings.mjMomentCombineMin || 2;
    const maxC = S.settings.mjMomentCombineMax || 3;
    const cardCount = S.settings.mjMomentCombine ? Math.floor(rnd(minC, maxC + 1)) : 1;
    const shuffled = [...chatPool].sort(() => 0.5 - Math.random());
    text = shuffled.slice(0, cardCount).join('\n');
  }
  let images = [];
  if (S.settings.mjMomentWithSticker && S.cards.sticker && S.cards.sticker.length && Math.random() < 0.5) {
    const stickerCount = Math.floor(Math.random() * 2) + 1;
    const shuffledStickers = [...S.cards.sticker].sort(() => 0.5 - Math.random());
    images = shuffledStickers.slice(0, stickerCount).map(s => typeof s === 'object' ? s.url : s);
  }
  if (!text && !images.length) return null;
  return {
    moment: {id:uid(), authorId: c.id, text, images, time:now, likes:[], comments:[]},
    text,
    images
  };
}

function checkAllTimers(){
  const now = Date.now();
  let dirty = false;

  S.contacts.forEach(c => {
    const cs = getChatSettings(c.id);
    if (cs.autoMsgEnabled && cs.nextAutoMsgTime && now > cs.nextAutoMsgTime + 60000) {
      const text = pick(S.cards.chat);
      if (text) pushMsg(c.id, { from:'mj', type:'text', text });
      const unit = cs.autoMsgUnit || 'hours';
      const multiplier = unit === 'minutes' ? 60000 : 3600000;
      cs.nextAutoMsgTime = now + rnd((cs.autoMsgMin || 2) * multiplier, (cs.autoMsgMax || 6) * multiplier);
      dirty = true;
    }
  });

  if (S.settings.mjMoment) {
    S.contacts.forEach(c => {
      const cs = getChatSettings(c.id);
      if (!cs.nextMomentTime) {
        cs.nextMomentTime = now + rnd((cs.momentMinHours || 4) * 3600000, (cs.momentMaxHours || 12) * 3600000);
        dirty = true; return;
      }
      if (now >= cs.nextMomentTime) {
        const generated = generateMjMoment(c, now);
        if (generated) {
          S.moments.push(generated.moment);
          S.unread.moments++;
          const title = (c.name || c.remark || '好友') + ' 发布了新动态';
          LibumEngine.push(title, generated.text || '[图片]', 'libum-moment', {}, !document.hidden, avatarSrc(c.avatar, c.name));
        }
        cs.nextMomentTime = now + rnd((cs.momentMinHours || 4) * 3600000, (cs.momentMaxHours || 12) * 3600000);
        dirty = true;
      }
    });
  }

  if (S.settings.nextLetterTime && now >= S.settings.nextLetterTime) {
    if (S.contacts.length) {
      const c = pickObj(S.contacts);
      if (c) {
        const body = composeLetterBody();
        S.letters.push({ id: uid(), cid: c.id, from: 'mj', title: '一封来信', body, time: now, read: false });
        S.unread.letters++;
        const title = (c.name || c.remark || '好友') + ' 的来信';
        LibumEngine.push(title, body, 'libum-letter', {}, !document.hidden, avatarSrc(c.avatar, c.name));
      }
    }
    S.settings.nextLetterTime = now + rnd((S.settings.letterMinHours || 2) * 3600000, (S.settings.letterMaxHours || 6) * 3600000);
    dirty = true;
  }

  S.contacts.forEach(c => {
    const cs = getChatSettings(c.id);
    if (!cs.autoMsgEnabled) return;
    if (!cs.nextAutoMsgTime) {
      const unit = cs.autoMsgUnit || 'hours';
      const multiplier = unit === 'minutes' ? 60000 : 3600000;
      cs.nextAutoMsgTime = now + rnd((cs.autoMsgMin || 2) * multiplier, (cs.autoMsgMax || 6) * multiplier);
      dirty = true; return;
    }
    if (now >= cs.nextAutoMsgTime) {
      const text = pick(S.cards.chat);
      if (text) pushMsg(c.id, { from:'mj', type:'text', text });
      const unit = cs.autoMsgUnit || 'hours';
      const multiplier = unit === 'minutes' ? 60000 : 3600000;
      cs.nextAutoMsgTime = now + rnd((cs.autoMsgMin || 2) * multiplier, (cs.autoMsgMax || 6) * multiplier);
      dirty = true;
    }
  });

  const vRange = visitorIntervalRange();
  if (!S.settings.nextVisitorTime) {
    S.settings.nextVisitorTime = now + rnd(vRange.minH * 3600000, vRange.maxH * 3600000);
    dirty = true;
  } else if (now >= S.settings.nextVisitorTime) {
    if (S.contacts.length) {
      const c = pickObj(S.contacts);
      if (c) {
        const entry = { id: c.id, time: now };
        if (Math.random() < 0.45) { const t = pick(S.cards.chat); if (t) entry.note = t; }
        S.visitors.push(entry);
        if (S.visitors.length > 80) S.visitors = S.visitors.slice(-80);
      }
    }
    S.settings.nextVisitorTime = now + rnd(vRange.minH * 3600000, vRange.maxH * 3600000);
    dirty = true;
  }

  if (S.settings.callEnabled && !call && S.contacts.length) {
    const cRange = callIntervalRange();
    if (!S.settings.nextCallTime) {
      S.settings.nextCallTime = now + rnd(cRange.minH * 3600000, cRange.maxH * 3600000);
      dirty = true;
    } else if (now >= S.settings.nextCallTime) {
      incomingCall();
      S.settings.nextCallTime = now + rnd(cRange.minH * 3600000, cRange.maxH * 3600000);
      dirty = true;
    }
  }

  simulateOtherPat();
  simulateOtherPat();

  if (S.settings.mjMoment && S.contacts.length) {
    const myMoments = S.moments.filter(m => m.authorId === 'me');
    if (myMoments.length && Math.random() < 0.1) {
      const target = myMoments[Math.floor(Math.random() * myMoments.length)];
      if (target.comments.length + target.likes.length <= 8) {
        const c = S.contacts[Math.floor(Math.random() * S.contacts.length)];
        if (c) {
          if (Math.random() < 0.55) {
            if (!target.likes.includes(c.id)) target.likes.push(c.id);
          } else {
            const pool = (S.cards.chat || []).map(it => (typeof it === 'object' ? it.text : it)).filter(Boolean);
            let text = '不错。';
            if (pool.length) {
              const minC = S.settings.mjMomentReplyMin || 1;
              const maxC = S.settings.mjMomentReplyMax || 2;
              const cardCount = S.settings.mjMomentMultiReply ? Math.floor(rnd(minC, maxC + 1)) : 1;
              const shuffled = [...pool].sort(() => 0.5 - Math.random());
              text = shuffled.slice(0, cardCount).join('，');
            }
            target.comments.push({ id: uid(), authorId: c.id, text });
          }
          dirty = true;
        }
      }
    }
  }

  if (dirty) {
    save();
    const top = stack[stack.length - 1].name;
    if (top === 'chatRoom' || top === 'moments' || top === 'mail' || top === 'visitors') {
      try { render(); } catch(e) {}
    } else {
      try { updateBadges(); } catch(e) {}
    }
  }
}

const TICK_MS = 30 * 1000;
let __lastTick = 0;
function safeTick(force){
  if (!force && document.hidden) return;
  const now = Date.now();
  if (!force && now - __lastTick < TICK_MS) return;
  __lastTick = now;
  try { checkAllTimers(); } catch(e){ console.error('tick error', e); }
}
setInterval(safeTick, 15000);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) { __lastTick = 0; setTimeout(() => safeTick(true), 300); }
});

const TASK_HORIZON_MS = 5 * 60 * 1000;

function collectUpcomingTasks(){
  const now = Date.now();
  const until = now + TASK_HORIZON_MS;
  const out = [];
  const inRange = t => t && t > now && t <= until;

  (S.contacts || []).forEach(c => {
    const cs = getChatSettings(c.id);
    if (!cs.autoMsgEnabled || !inRange(cs.nextAutoMsgTime)) return;
    const body = pick(S.cards.chat) || '在吗？';
    out.push({
      id: `auto_${c.id}_${Math.round(cs.nextAutoMsgTime / 1000)}`,
      fireAt: cs.nextAutoMsgTime,
      title: c.name || '好友',
      body,
      tag: `libum-chat-${c.id}`,
      data: { cid: c.id, type: 'AUTO_MSG' }
    });
  });

  if (inRange(S.settings.nextLetterTime) && S.contacts.length) {
    const c = S.contacts[0];
    out.push({
      id: `letter_${Math.round(S.settings.nextLetterTime / 1000)}`,
      fireAt: S.settings.nextLetterTime,
      title: `${c.name || '好友'} 的来信`,
      body: '有一封新的来信',
      tag: 'libum-letter',
      data: { cid: c.id, type: 'LETTER' }
    });
  }

  (S.contacts || []).forEach(c => {
    const cs = getChatSettings(c.id);
    if (!inRange(cs.nextMomentTime)) return;
    out.push({
      id: `moment_${c.id}_${Math.round(cs.nextMomentTime / 1000)}`,
      fireAt: cs.nextMomentTime,
      title: `${c.name || '好友'} 发布了新动态`,
      body: '快去看看',
      tag: 'libum-moment',
      data: { cid: c.id, type: 'MOMENT' }
    });
  });

  return out;
}

function handoffToSW(){
  if (!('serviceWorker' in navigator)) return;
  const tasks = collectUpcomingTasks();
  navigator.serviceWorker.ready.then(reg => {
    const sw = reg.active || navigator.serviceWorker.controller;
    if (!sw) return;
    if (tasks.length) {
      sw.postMessage({ type: 'SCHEDULE_TASKS', tasks });
    }
    sw.postMessage({ type: 'PING_SW' });
  }).catch(() => {});
}

async function syncBackFromSW() {
  try {
    const raw = await idbGet('libum_data');
    if (raw) {
      const d = JSON.parse(raw);
      if (d && d.state) {
        const state = unpackAssets(d.state, d.assets);
        if (state) {
          S = deepMerge(clone(DEFAULT_STATE), state);
          normalizeState();
          lastScrollKey = '';
          applySettings();
          const cur = stack[stack.length - 1];
          if (cur.name === 'chatRoom') {
            try { refreshChat(); } catch (e) {}
            updateBadges();
          } else {
            render();
          }
        }
      }
    }
  } catch (e) { console.warn('syncBackFromSW 拉数据失败', e); }

  try {
    const rawQ = await idbGet('libum_queue');
    if (rawQ) {
      const q = typeof rawQ === 'string' ? JSON.parse(rawQ) : rawQ;
      if (Array.isArray(q) && q.length) {
        let touched = false;
        q.forEach(item => {
          if (!item || !item.cid || !item.t) return;
          if (!S.chats[item.cid]) S.chats[item.cid] = [];
          S.chats[item.cid].push({
            id: uid(),
            from: 'mj',
            type: 'text',
            text: item.t,
            time: item.ts || Date.now()
          });
          if (!S.unread.chats[item.cid]) S.unread.chats[item.cid] = 0;
          S.unread.chats[item.cid]++;
          touched = true;
        });
        if (touched) save(true);
      }
      if (idbDB) {
        try {
          const tx = idbDB.transaction('kv', 'readwrite');
          tx.objectStore('kv').delete('libum_queue');
        } catch (e) {}
      }
    }
  } catch (e) { console.warn('syncBackFromSW 消费队列失败', e); }

  try { await idbSet('libum_scheduled_tasks', []); } catch (e) {}
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') {
    handoffToSW();
  } else {
    syncBackFromSW();
  }
});

function composeLetterBody(){
  const pools = [];
  if(Array.isArray(S.cards.chat) && S.cards.chat.length) pools.push(S.cards.chat);
  if(Array.isArray(S.cards.quiz) && S.cards.quiz.length) pools.push(S.cards.quiz);

  const all = [];
  pools.forEach(pool => pool.forEach(it => {
    const t = typeof it === 'object' ? it.text : it;
    if(t && typeof t === 'string' && t.trim()) all.push(t.trim());
  }));

  if(!all.length) return pick(S.cards.chat) || '近来可好？';

  let minC = S.settings.letterCardMin || 1;
  let maxC = S.settings.letterCardMax || 3;
  if(maxC < minC) maxC = minC;
  const count = Math.max(1, Math.min(all.length, Math.floor(rnd(minC, maxC + 1))));

  const copy = all.slice();
  const picked = [];
  for(let i = 0; i < count && copy.length; i++){
    const idx = Math.floor(Math.random() * copy.length);
    picked.push(copy[idx]);
    copy.splice(idx, 1);
  }
  return picked.join('\n\n');
}

function fetchWithTimeout(url, ms, opts){
  return new Promise((resolve, reject) => {
    const ctrl = new AbortController();
    const timer = setTimeout(() => { ctrl.abort(); reject(new Error('timeout')); }, ms || 8000);
    fetch(url, Object.assign({}, opts || {}, { signal: ctrl.signal, mode: 'cors', credentials: 'omit' }))
      .then(res => { clearTimeout(timer); resolve(res); })
      .catch(err => { clearTimeout(timer); reject(err); });
  });
}

async function searchNetease() {
  const input = $('#searchInput');
  if (!input) return;
  const keyword = input.value.trim();
  if (!keyword) { showToast('请输入歌名或歌手'); return; }
  
  const resultDiv = $('#searchResults');
  resultDiv.innerHTML = '<div style="text-align:center;font-size:12px;opacity:.6;padding:10px;">正在搜索…</div>';
  
  let data = null;
  const qs = `server=netease&type=search&id=${encodeURIComponent(keyword)}`;
  
  for (const build of METING_APIS) {
    try {
      const res = await fetchWithTimeout(build(qs), 8000);
      if (res && res.ok) {
        const json = await res.json();
        if (Array.isArray(json) && json.length) { data = json; break; }
        if (json && typeof json === 'object') {
          const list = json.data || json.result || json.songs;
          if (Array.isArray(list) && list.length) { data = list; break; }
        }
      }
    } catch (e) {}
  }

  if (!data || !data.length) {
    resultDiv.innerHTML = '<div style="text-align:center;font-size:12px;opacity:.6;padding:10px;">未找到相关歌曲，请尝试更换关键词</div>';
    return;
  }

  window.__searchResults = data.map(item => {
    const id = item.id || (item.url && item.url.match(/id=(\d+)/)?.[1]) || '';
    const name = item.name || item.title || '未知歌曲';
    const artist = item.artist || '未知歌手';
    const cover = item.pic || item.cover || '';
    const url = item.url || `https://music.163.com/song/media/outer/url?id=${id}.mp3`;
    return { id, name, artist, cover, url };
  });

  resultDiv.innerHTML = window.__searchResults.map((song, index) => `
    <div class="search-result-item" onclick="playSearchResult(${index})">
      <div class="sr-cover">
        ${song.cover ? `<img src="${song.cover}">` : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.1);">${ICONS.music}</div>`}
      </div>
      <div class="sr-info">
        <div class="sr-name">${esc(song.name)}</div>
        <div class="sr-artist">${esc(song.artist)}</div>
      </div>
    </div>
  `).join('');
}

function playSearchResult(index) {
  const song = window.__searchResults?.[index];
  if (!song) return;
  addSongAndPlay(song);
  showToast(`正在播放：${song.name}`);
}

function addSongAndPlay(song){
  let existing = S.songs.find(s => s.type === '163' && String(s.neteaseId) === String(song.id))
              || S.songs.find(s => s.name === song.name && s.artist === song.artist);
  if(existing){
    if(song.url) existing.url = song.url;
    if(song.cover) existing.cover = song.cover;
    S.songs.forEach(s => { s.paused = (s.id !== existing.id); });
    S.currentSong = existing.id;
    if (!S.settings.playHistory) S.settings.playHistory = [];
    S.settings.playHistory = [existing.id, ...S.settings.playHistory.filter(x => x !== existing.id)].slice(0, 50);
    save(true); render();
    return existing.id;
  }
  const ns = {
    id: uid(), type: '163', neteaseId: String(song.id),
    url: song.url, name: song.name, artist: song.artist,
    cover: song.cover, title: song.name + ' - ' + song.artist,
    paused: false, liked: false
  };
  S.songs.push(ns);
  S.songs.forEach(s => { if(s.id !== ns.id) s.paused = true; });
  S.currentSong = ns.id;
  if (!S.settings.playHistory) S.settings.playHistory = [];
  S.settings.playHistory = [ns.id, ...S.settings.playHistory.filter(x => x !== ns.id)].slice(0, 50);
  save(true); render();
  return ns.id;
}

async function parseNeteaseId(input){
  if(!input) return '';
  let s = String(input).trim();
  const urlMatch = s.match(/(https?:\/\/[^\s]+)/);
  if (urlMatch) s = urlMatch[1];
  if(/^\d+$/.test(s)) return s;
  if(/163cn\.(tv|link)\//i.test(s)){
    try{
      const redirectRes = await fetchWithTimeout(s, 8000, { method: 'HEAD', redirect: 'follow' });
      if(redirectRes && redirectRes.url && redirectRes.url !== s) s = redirectRes.url;
    }catch(e){
      try{
        const getRes = await fetchWithTimeout(s, 8000, { method: 'GET', redirect: 'follow' });
        if(getRes && getRes.url && getRes.url !== s) s = getRes.url;
      }catch(e2){}
    }
  }
  let m = s.match(/[?&#]id=(\d+)/); if (m) return m[1];
  m = s.match(/playlist\/(\d+)/); if (m) return m[1];
  m = s.match(/discover\/toplist\/(\d+)/); if (m) return m[1];
  m = s.match(/(\d{6,})/); if (m) return m[1];
  return '';
}

function metingToSong(item){
  if(!item || typeof item !== 'object') return null;
  let id = item.id ? String(item.id) : '';
  if(!id && item.url){ const mm = String(item.url).match(/id=(\d+)/); if(mm) id = mm[1]; }
  if(!id) id = uid();
  const name = item.name || item.title || '未知歌曲';
  const artist = item.artist || item.author || '未知歌手';
  const cover = item.pic || item.cover || '';
  const url = `https://music.163.com/song/media/outer/url?id=${id}.mp3`;
  return { id, name, artist, cover, url };
}

async function fetchNeteasePlaylistSongs(pid){
  const qs = `server=netease&type=playlist&id=${encodeURIComponent(pid)}`;
  for (const build of METING_APIS){
    try{
      const res = await fetchWithTimeout(build(qs), 10000);
      if(res && res.ok){
        const json = await res.json().catch(() => null);
        let arr = null;
        if(Array.isArray(json)) arr = json;
        else if(json && Array.isArray(json.data)) arr = json.data;
        else if(json && Array.isArray(json.result)) arr = json.result;
        if(arr && arr.length) return arr;
      }
    }catch(e){}
  }
  return null;
}

function addSongsToLibrary(songs){
  let added = 0;
  songs.forEach(song => {
    const exist = S.songs.find(s => s.type === '163' && String(s.neteaseId) === String(song.id));
    if(exist) return;
    S.songs.push({
      id: uid(), type: '163', neteaseId: String(song.id),
      url: song.url, name: song.name, artist: song.artist,
      cover: song.cover, title: song.name + ' - ' + song.artist,
      paused: true, liked: false
    });
    added++;
  });
  save(true);
  return added;
}

function renderSongList(){
  let list = [];
  if (songTab === 'library') list = S.songs;
  else if (songTab === 'liked') list = S.songs.filter(s => s.liked);
  else if (songTab === 'history') {
    const historyIds = (S.settings.playHistory || []).slice();
    const seen = new Set();
    list = historyIds.map(id => S.songs.find(s => s.id === id)).filter(s => { if (!s || seen.has(s.id)) return false; seen.add(s.id); return true; });
  }
  if (!list.length) {
    const emptyText = songTab === 'library' ? '曲库为空，试试搜索添加' : songTab === 'liked' ? '还没有收藏的歌曲' : '还没有播放记录';
    return `<div style="font-size:12px;opacity:.6;padding:8px 4px;text-align:center;">${emptyText}</div>`;
  }
  return list.map(s => {
    const coverImg = s.cover || 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40"><rect width="40" height="40" fill="rgba(255,255,255,0.1)"/><path d="M12 20 L28 20 L28 12 L12 12 Z" fill="rgba(255,255,255,0.3)"/></svg>');
    const isInvalid = !!s.urlInvalid;
    return `<div class="song-item ${S.currentSong===s.id?'active':''}" ${isInvalid ? '' : `onclick="playSong('${s.id}')"`}>
      <img class="song-cover" src="${coverImg}">
      <div class="song-info">
        <div class="song-name" style="${isInvalid?'opacity:.55;':''}">${esc(s.name || s.title || '未命名')}${isInvalid ? ' ⚠️' : ''}</div>
        <div class="song-artist" style="${isInvalid?'color:#ffb04a;':''}">${isInvalid ? '音频文件已失效，需重新选择' : esc(s.artist || '未知歌手')}</div>
      </div>
      ${isInvalid
        ? `<button class="song-delete" style="color:#ffb04a;background:rgba(255,176,74,.18);width:auto;padding:0 10px;border-radius:10px;" onclick="event.stopPropagation();reimportSong('${s.id}')">重选</button>`
        : `<button class="song-like-btn ${s.liked?'liked':''}" onclick="event.stopPropagation();toggleSongLike('${s.id}')" title="${s.liked?'取消收藏':'收藏'}">${s.liked ? ICONS.heartFill : ICONS.heart}</button>
           <button class="song-delete" onclick="event.stopPropagation();removeSong('${s.id}')">${ICONS.close}</button>`}
    </div>`;
  }).join('');
}

function reimportSong(id){
  const s = S.songs.find(x => x.id === id);
  if (!s) return;
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'audio/*';
  inp.onchange = () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    s.url = URL.createObjectURL(f);
    s.urlInvalid = false;
    if (!s.name || s.name === '未命名') s.name = f.name.replace(/\.[^.]+$/, '');
    if (!s.artist) s.artist = '本地文件';
    save(); render();
    showToast('已重新关联音频文件');
  };
  inp.click();
}

function setPlayMode(mode){
  if (!PLAY_MODES[mode]) return;
  S.settings.playMode = mode;
  save();
  const btn = document.getElementById('playModeBtn');
  if (btn) { btn.innerHTML = ICONS[PLAY_MODES[mode].icon]; btn.title = PLAY_MODES[mode].label; }
  showToast('已切换：' + PLAY_MODES[mode].label);
}

function cyclePlayMode(){
  const modes = ['list', 'single', 'shuffle', 'order'];
  const cur = S.settings.playMode || 'list';
  const idx = modes.indexOf(cur);
  const next = modes[(idx + 1) % modes.length];
  S.settings.playMode = next;
  save();
  const btn = document.getElementById('playModeBtn');
  if (btn) { btn.innerHTML = ICONS[PLAY_MODES[next].icon]; btn.title = PLAY_MODES[next].label; }
  showToast(PLAY_MODES[next].label);
}

function handleAudioEnded(){
  if(!audio || !audioSongId) return;
  const mode = S.settings.playMode || 'list';
  const idx = S.songs.findIndex(s => s.id === audioSongId);
  if(idx < 0) return;
  if(mode === 'single'){ audio.currentTime = 0; audio.play().catch(()=>{}); return; }
  let nextIdx = idx + 1;
  if(mode === 'shuffle'){ nextIdx = Math.floor(Math.random() * S.songs.length); if(nextIdx === idx && S.songs.length > 1) nextIdx = (nextIdx + 1) % S.songs.length; }
  else if(mode === 'list'){ nextIdx = (idx + 1) % S.songs.length; }
  else if(mode === 'order'){ if(idx >= S.songs.length - 1){ S.songs.forEach(s => s.paused = true); save(); render(); return; } }
  if(nextIdx >= 0 && nextIdx < S.songs.length){
    S.songs.forEach(s => s.paused = true);
    const nextSong = S.songs[nextIdx];
    nextSong.paused = false;
    S.currentSong = nextSong.id;
    if (!S.settings.playHistory) S.settings.playHistory = [];
    S.settings.playHistory = [nextSong.id, ...S.settings.playHistory.filter(x => x !== nextSong.id)].slice(0, 50);
    save();
    if(audio && nextSong.url){ try{ audio.pause(); }catch(e){} audio.src = nextSong.url; audioSongId = nextSong.id; audio.play().catch(()=>{}); updateListenUI(); }
    else { render(); }
  }
}
function updateListenUI(){
  const cur = S.songs.find(s=>s.id===S.currentSong);
  const playing = !!(cur && !cur.paused);
  const title = cur ? (cur.name || cur.title || '未命名') : '还没有选择歌曲';
  const artist = cur ? (cur.artist || '未知歌手') : '';
  const t = document.querySelector('.listen-title'); if(t) t.textContent = title;
  const s = document.querySelector('.listen-sub'); if(s) s.textContent = `${artist} · ${S.listenWith?'和对方一起听中':'独自听'}`;
  const disc = $('#listenDisc');
  const cover = $('#discCover');
  if(disc){ disc.classList.toggle('spin', playing); disc.classList.toggle('paused', !playing); }
  if(cover){
    if(cur && cur.cover){ cover.style.backgroundImage = `url('${cur.cover}')`; cover.innerHTML = ''; }
    else { cover.style.backgroundImage = ''; cover.innerHTML = ICONS.music; }
  }
  const playBtn = $('#discPlayBtn');
  if(playBtn) playBtn.innerHTML = playing ? ICONS.pause : ICONS.play;
  document.querySelectorAll('.song-item').forEach((el, i) => {
    const song = S.songs[i]; if(!song) return;
    el.classList.toggle('active', song.id === S.currentSong);
    const sp = el.querySelector('.song-play');
    if(sp) sp.innerHTML = (song.id === S.currentSong && !song.paused) ? ICONS.pause : ICONS.play;
  });
}

function bindListen(){
  const searchBtn = $('#searchBtn');
  if (searchBtn) searchBtn.onclick = searchNetease;

  const imp = $('#importBtn');
  if (imp) {
    imp.onclick = () => {
      const inp = document.createElement('input');
      inp.type = 'file'; inp.accept = 'audio/*'; inp.multiple = true;
      inp.onchange = () => { Array.from(inp.files).forEach(f => { S.songs.push({ id: uid(), type: 'local', url: URL.createObjectURL(f), name: f.name.replace(/\.[^.]+$/, ''), artist: '本地文件', cover: '', title: f.name.replace(/\.[^.]+$/, ''), paused: true, liked: false }); }); save(); render(); };
      inp.click();
    };
  }

  const cur = S.songs.find(s => s.id === S.currentSong);
  if (cur && cur.url) {
    if (cur.urlInvalid || (typeof cur.url === 'string' && cur.url.startsWith('blob:'))) {
      if (audio) { try { audio.pause(); } catch(e){} audio = null; audioSongId = null; }
      showToast('该歌曲的音频文件已失效，请重新导入');
    } else {
      if (!audio || audioSongId !== cur.id) {
        if (audio) { try { audio.pause(); } catch(e){} }
        audio = new Audio(cur.url);
        audioSongId = cur.id;
        audio.preload = 'auto';
        audio.onended = handleAudioEnded;
        audio.onerror = () => {
          const badSong = S.songs.find(s => s.id === audioSongId);
          if (badSong && typeof badSong.url === 'string' && badSong.url.startsWith('blob:')) {
            badSong.urlInvalid = true;
            save();
            showToast('本地音频文件已失效，请点击「重选」重新导入');
            if (stack[stack.length-1].name === 'listen') render();
          } else {
            showToast('这首歌暂时无法播放（可能已下架或需要会员）');
          }
        };
      } else {
        audio.onended = handleAudioEnded;
      }
      if (cur.paused) { if (!audio.paused) audio.pause(); }
      else { const p = audio.play(); if (p && p.catch) p.catch(() => {}); }
    }
  } else if (audio) {
    try { audio.pause(); } catch(e){} audio = null; audioSongId = null;
  }
  if (audioTimer) { clearInterval(audioTimer); audioTimer = null; }
  if (audio) { audioTimer = setInterval(updateProgressUI, 400); }
  updateProgressUI();
  const bar = $('#progressBar');
  if (bar) { bar.onclick = (e) => { if (!audio || !audio.duration || !isFinite(audio.duration)) return; const rect = bar.getBoundingClientRect(); const x = e.clientX - rect.left; audio.currentTime = (x / rect.width) * audio.duration; updateProgressUI(); }; }
}
function updateProgressUI(){
  const fill = $('#progressFill'); const curEl = $('#currentTime'); const totEl = $('#totalTime'); if (!fill) return;
  if (audio && audio.duration && isFinite(audio.duration)) { const p = Math.max(0, Math.min(1, audio.currentTime / audio.duration)); fill.style.width = (p * 100) + '%'; if (curEl) curEl.textContent = fmtTime(audio.currentTime); if (totEl) totEl.textContent = fmtTime(audio.duration); }
  else { fill.style.width = '0%'; if (curEl) curEl.textContent = '00:00'; if (totEl) totEl.textContent = '00:00'; }
}

function togglePlay() {
  if (!S.songs.length) { showToast('请先添加歌曲'); return; }
  let cur = S.songs.find(s => s.id === S.currentSong);
  if (!cur) { S.songs.forEach(s => s.paused = true); cur = S.songs[0]; cur.paused = false; S.currentSong = cur.id; }
  else {
    if (!cur.url) { showToast('这首歌没有可播放的链接'); return; }
    if (cur.urlInvalid || (typeof cur.url === 'string' && cur.url.startsWith('blob:'))) {
      showToast('该歌曲的音频文件已失效，请重新导入');
      return;
    }
    cur.paused = !cur.paused;
  }
  save(); render();
}
function playIndex(i) { 
  if (!S.songs.length) return; 
  const song = S.songs[i]; if (!song) return; 
  S.songs.forEach(s => { s.paused = (s.id !== song.id); }); 
  song.paused = false; 
  S.currentSong = song.id; 
  if (!S.settings.playHistory) S.settings.playHistory = [];
  S.settings.playHistory = [song.id, ...S.settings.playHistory.filter(x => x !== song.id)].slice(0, 50);
  save(); render(); 
}
function prevSong() { if (!S.songs.length) { showToast('播放列表为空'); return; } let i = S.songs.findIndex(s => s.id === S.currentSong); if (i < 0) i = 0; i = (i - 1 + S.songs.length) % S.songs.length; playIndex(i); }
function nextSong() { if (!S.songs.length) { showToast('播放列表为空'); return; } let i = S.songs.findIndex(s => s.id === S.currentSong); i = (i + 1) % S.songs.length; playIndex(i); }

function playSong(id){ 
  const cur = S.songs.find(s => s.id === id); 
  if (!cur) return; 
  if (cur.urlInvalid || (typeof cur.url === 'string' && cur.url.startsWith('blob:'))) {
    showToast('该歌曲的音频文件已失效，请点击「重选」重新导入');
    return;
  }
  S.songs.forEach(s => { s.paused = (s.id !== id); }); 
  cur.paused = false; 
  S.currentSong = id; 
  if (!S.settings.playHistory) S.settings.playHistory = [];
  S.settings.playHistory = [id, ...S.settings.playHistory.filter(x => x !== id)].slice(0, 50);
  save(); 
  render(); 
  if (S.listenWith && Math.random() < 0.6) { setTimeout(() => showToast('对方也在听这首歌'), 1200); } 
}
function toggleListen() { if (!S.contacts.length) { showToast('请先添加联系人'); return; } if (S.listenWith) { S.listenWith = false; save(); render(); showToast('已结束一起听'); } else { showToast('正在邀请对方...'); setTimeout(() => { S.listenWith = true; save(); render(); showToast('对方已接受邀请'); }, 1500); } }
function removeSong(id){ S.songs = S.songs.filter(s => s.id !== id); if (S.currentSong === id) { S.currentSong = null; if (audio) { try { audio.pause(); } catch(e){} audio = null; audioSongId = null; } if (audioTimer) { clearInterval(audioTimer); audioTimer = null; } } save(); render(); }

function rateToRange(rate, minAtFull, maxAtFull, minAtZero, maxAtZero){
  let r = Number(rate);
  if(isNaN(r)) r = 50;
  r = Math.max(0, Math.min(100, r)) / 100;
  const minH = minAtFull + (minAtZero - minAtFull) * (1 - r);
  const maxH = maxAtFull + (maxAtZero - maxAtFull) * (1 - r);
  return { minH, maxH };
}
function callIntervalRange(){
  const rate = (S.settings.callRate == null ? 70 : S.settings.callRate);
  return rateToRange(rate, 0.5, 2, 10, 30);
}
function visitorIntervalRange(){
  const rate = (S.settings.visitorRate == null ? 50 : S.settings.visitorRate);
  return rateToRange(rate, 0.5, 2, 12, 48);
}
function fmtHourLabel(h){
  if(h < 1) return Math.round(h * 60) + '分钟';
  if(Math.abs(h - Math.round(h)) < 0.05) return Math.round(h) + '小时';
  return h.toFixed(1) + '小时';
}
function fmtHourRange(r){ return fmtHourLabel(r.minH) + '~' + fmtHourLabel(r.maxH); }

async function installPWA(){
  if (deferredInstallPrompt){
    try{
      deferredInstallPrompt.prompt();
      const r = await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      showToast(r && r.outcome === 'accepted' ? '已开始安装' : '已取消安装');
      return;
    }catch(e){}
  }
  const ua = navigator.userAgent;
  const isEdge = /Edg\//.test(ua);
  const isIOS = /iPhone|iPad|iPod/.test(ua);
  let tips = '';
  if (isIOS) tips = 'Safari：点击底部「分享」按钮 → 选择「添加到主屏幕」';
  else if (isEdge) tips = 'Edge：点击右上角「…」→「应用」→「将此站点作为应用安装」<br><span style="opacity:.75">如果没看到该选项，请确认是通过 https 访问的</span>';
  else tips = 'Chrome：点击地址栏右侧的「安装」图标，或菜单 →「投放、保存和共享」→「安装页面为应用」';
  openModal(`<div class="modal-title">添加到桌面</div>
    <div style="font-size:13px;line-height:1.9;">${tips}</div>
    <div style="font-size:11.5px;opacity:.6;line-height:1.75;margin-top:14px;padding:10px 12px;background:rgba(255,255,255,.08);border-radius:12px;">

function openClearChatHistoryModal(cid){
  const targetCid = cid || null;
  const d = new Date();
  const todayStr = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  const m = openModal(`
    <div class="modal-title">清空聊天记录</div>
    <div style="font-size:11.5px;opacity:.68;line-height:1.7;margin-bottom:12px;padding:10px 12px;background:rgba(255,255,255,.08);border-radius:12px;">
      仅删除聊天消息。联系人、朋友圈、信件、字卡、访客等其他数据不受影响。
    </div>
    <div class="field-label">选择日期</div>
    <input class="field-input" id="clrDate" type="date" value="${todayStr}" style="color:#fff">
    <div class="field-label">清除范围</div>
    <div class="chip-row" id="clrModes">
      <div class="chip active" data-mode="before">该日期之前</div>
      <div class="chip" data-mode="day">仅该日期</div>
      <div class="chip" data-mode="after">该日期之后</div>
    </div>
    <div id="clrInfo" style="font-size:12px;opacity:.72;margin:8px 0 4px;line-height:1.6;"></div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">取消</button>
      <button class="btn" id="clrConfirm" style="background:rgba(255,90,110,.7);border-color:rgba(255,120,140,.55);">清空</button>
    </div>
  `);
  let mode = 'before';
  const dateInput = m.querySelector('#clrDate');
  const info = m.querySelector('#clrInfo');
  const countMsgs = () => {
    const dateStr = dateInput.value;
    if(!dateStr) return 0;
    const start = new Date(dateStr + 'T00:00:00').getTime();
    const end = start + 86400000;
    let n = 0;
    const ids = targetCid ? [targetCid] : Object.keys(S.chats || {});
    ids.forEach(id => {
      (S.chats[id] || []).forEach(msg => {
        const t = msg.time || 0;
        if(mode === 'before' && t < start) n++;
        else if(mode === 'day' && t >= start && t < end) n++;
        else if(mode === 'after' && t >= end) n++;
      });
    });
    return n;
  };
  const updateInfo = () => {
    if(!dateInput.value){ info.textContent = '请选择日期'; return; }
    const n = countMsgs();
    const scope = targetCid ? '当前聊天' : '全部聊天';
    info.textContent = `将在${scope}中删除 ${n} 条消息`;
  };
  dateInput.onchange = updateInfo;
  m.querySelectorAll('#clrModes .chip').forEach(ch => {
    ch.onclick = () => {
      m.querySelectorAll('#clrModes .chip').forEach(x => x.classList.remove('active'));
      ch.classList.add('active');
      mode = ch.dataset.mode;
      updateInfo();
    };
  });
  updateInfo();
  m.querySelector('#clrConfirm').onclick = () => {
    const dateStr = dateInput.value;
    if(!dateStr){ showToast('请选择日期'); return; }
    const start = new Date(dateStr + 'T00:00:00').getTime();
    const end = start + 86400000;
    const n = countMsgs();
    if(n === 0){ showToast('该范围没有可删除的消息'); return; }
    if(!confirm(`确定删除 ${n} 条聊天消息吗？此操作无法恢复。`)) return;
    let removed = 0;
    const ids = targetCid ? [targetCid] : Object.keys(S.chats || {});
    ids.forEach(id => {
      const msgs = S.chats[id];
      if(!Array.isArray(msgs)) return;
      const before = msgs.length;
      S.chats[id] = msgs.filter(msg => {
        const t = msg.time || 0;
        if(mode === 'before') return t >= start;
        if(mode === 'day') return t < start || t >= end;
        if(mode === 'after') return t < end;
        return true;
      });
      const diff = before - S.chats[id].length;
      removed += diff;
      if(diff > 0 && S.unread && S.unread.chats && !S.chats[id].length) S.unread.chats[id] = 0;
    });
    save(true);
    closeModal();
    if(stack[stack.length-1].name === 'chatRoom') refreshChat();
    updateBadges();
    showToast(`已删除 ${removed} 条聊天消息`);
  };
}

function importCardsJSON(){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json,.txt';
  inp.onchange = () => {
    const f = inp.files && inp.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => {
      try{
        let raw;
        try{ raw = JSON.parse(r.result); } catch(pe){ throw new Error('文件不是有效的 JSON'); }
        if(raw === null || raw === undefined) throw new Error('文件内容为空');
        const result = { chat:0, pat:0, quiz:0, emoji:0, sticker:0 };
        const addedGroups = new Set();
        const importGroupItems = (items, groupName, type) => {
          if(!Array.isArray(items)) return 0;
          if(!S.cards[type]) S.cards[type] = [];
          let count = 0;
          items.forEach(it => {
            if(typeof it === 'string'){
              let s = it.trim();
              if(type === 'pat'){
                s = s.split('{name}').join('你').split('对方').join('你');
                if(s.indexOf('|') > -1){ const parts = s.split('|').map(x=>x.trim()); s = parts[1] || parts[0] || s; }
                if(s.indexOf('你') === -1) s = s + '你';
              }
              if(s && !S.cards[type].some(x => (typeof x === 'object' ? x.text : x) === s)){
                S.cards[type].push({ id: uid(), text: s, group: groupName || '默认分组' });
                count++;
              }
              return;
            }
            if(it && typeof it === 'object'){
              const url = it.url ?? it.src ?? it.image;
              if(typeof url === 'string' && (/^https?:\/\//i.test(url) || url.startsWith('data:image'))){
                if(!S.cards.sticker) S.cards.sticker = [];
                if(!S.cards.sticker.some(x => x.url === url)){
                  S.cards.sticker.push({ id: uid(), url, group: groupName || '', name: it.name || it.remark || '' });
                  result.sticker++;
                }
                return;
              }
              let t = it.text ?? it.title ?? it.content ?? it.value;
              if(t !== undefined && String(t).trim()){
                let s = String(t).trim();
                if(type === 'pat'){
                  s = s.split('{name}').join('你').split('对方').join('你');
                  if(s.indexOf('|') > -1){ const parts = s.split('|').map(x=>x.trim()); s = parts[1] || parts[0] || s; }
                  if(s.indexOf('你') === -1) s = s + '你';
                }
                if(!S.cards[type].some(x => (typeof x === 'object' ? x.text : x) === s)){
                  S.cards[type].push({ id: uid(), text: s, group: groupName || '默认分组' });
                  count++;
                }
              }
            }
          });
          return count;
        };
        if(raw && typeof raw === 'object' && Array.isArray(raw.customReplyGroups)){
          raw.customReplyGroups.forEach(g => {
            if(!g || typeof g !== 'object') return; if(g.disabled) return;
            const groupName = String(g.name || '').trim() || '默认分组';
            const items = g.items || g.list || g.values || g.data || [];
            const count = importGroupItems(items, groupName, 'chat');
            if(count > 0){ addedGroups.add(groupName); result.chat += count; }
          });
        } else if(raw && typeof raw === 'object' && Array.isArray(raw.groups)){
          raw.groups.forEach(g => {
            if(!g || typeof g !== 'object') return; if(g.disabled) return;
            const groupName = String(g.name || '').trim() || '默认分组';
            const items = g.items || g.list || g.values || [];
            const count = importGroupItems(items, groupName, 'chat');
            if(count > 0){ addedGroups.add(groupName); result.chat += count; }
          });
        } else if(Array.isArray(raw)){
          const targetType = (cardsTab && cardsTab !== 'sticker') ? cardsTab : 'chat';
          const count = importGroupItems(raw, '', targetType);
          result[targetType] += count;
        } else if(raw && typeof raw === 'object'){
          const aliasMap = { chat: ['chat','聊天','chats','对话'], pat: ['pat','拍一拍','pats'], quiz: ['quiz','问卷','quizzes'], emoji: ['emoji','emojis','表情'], sticker: ['sticker','stickers','表情包','图片'] };
          let hitAny = false;
          Object.keys(aliasMap).forEach(type => {
            for(const k of aliasMap[type]){
              if(raw[k] !== undefined){ hitAny = true; const count = importGroupItems(raw[k], '', type); result[type] += count; break; }
            }
          });
          if(!hitAny){ const count = importGroupItems([raw], '', (cardsTab && cardsTab !== 'sticker') ? cardsTab : 'chat'); result.chat += count; }
        } else { throw new Error('无法识别的 JSON 结构'); }
        const total = result.chat + result.pat + result.quiz + result.emoji + result.sticker;
        if(total === 0){ showToast('没有新增字卡（可能都已存在）'); return; }
        save(); render();
        const parts = [];
        if(result.chat) parts.push(`聊天 ${result.chat}`);
        if(result.pat) parts.push(`拍一拍 ${result.pat}`);
        if(result.quiz) parts.push(`问卷 ${result.quiz}`);
        if(result.emoji) parts.push(`Emoji ${result.emoji}`);
        if(result.sticker) parts.push(`表情包 ${result.sticker}`);
        const groupTip = addedGroups.size > 0 ? `（${addedGroups.size}个分组）` : '';
        showToast(`导入成功${groupTip}：${parts.join('，')}`);
      }catch(e){ console.error(e); showToast('导入失败：' + (e.message || '格式错误')); }
    };
    r.readAsText(f);
  };
  inp.click();
}

function deduplicateCards() {

  arr.forEach(item => { const key = typeof item === 'object' ? (item.url || item.text) : item; if (!seen.has(key)) { seen.add(key); result.push(item); } });
  const removed = arr.length - result.length;
  S.cards[cardsTab] = result; save(); render();
  showToast(removed > 0 ? `已去除 ${removed} 条重复项` : '没有发现重复项');
}

function parseVideoUrl(url) {
  if (!url) return { type: 'unknown', typeLabel: '未知' };
  const u = url.trim();
  let m = u.match(/b23\.tv\/([A-Za-z0-9]+)/);
  if (m) return { type: 'bilibili_short', typeLabel: 'B站短链', videoId: m[1], embedUrl: '', originalUrl: u };
  m = u.match(/bilibili\.com\/video\/(BV[A-Za-z0-9]+)/);
  if (m) return { type: 'bilibili', typeLabel: 'B站视频', videoId: m[1], embedUrl: `https://player.bilibili.com/player.html?bvid=${m[1]}&autoplay=0&high_quality=1`, originalUrl: u };
  m = u.match(/v\.douyin\.com\/([A-Za-z0-9]+)/);
  if (m) return { type: 'douyin_short', typeLabel: '抖音短链', videoId: m[1], embedUrl: '', originalUrl: u };
  m = u.match(/(?:douyin|iesdouyin)\.com\/(?:video|share\/video)\/(\d+)/);
  if (m) return { type: 'douyin', typeLabel: '抖音', videoId: m[1], embedUrl: `https://open.douyin.com/player/video?vid=${m[1]}&autoplay=1`, originalUrl: u };
  m = u.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([A-Za-z0-9_-]{11})/);
  if (m) return { type: 'youtube', typeLabel: 'YouTube', videoId: m[1], embedUrl: `https://www.youtube.com/embed/${m[1]}?autoplay=1`, originalUrl: u };
  if (/v\.youku\.com|iqiyi\.com|v\.qq\.com/.test(u)) return { type: 'cn_video', typeLabel: '影视平台', embedUrl: '', originalUrl: u };
  if (/\.(mp4|webm|ogg|m3u8)(\?|$)/i.test(u)) return { type: 'direct', typeLabel: '视频文件', embedUrl: u, originalUrl: u };
  return { type: 'external', typeLabel: '外部链接', embedUrl: '', originalUrl: u };
}

function toggleWatchFullscreen() {
  const el = document.getElementById('watchPlayer');
  if (!el) return;
  if (el.classList.contains('fake-fullscreen')) {
    el.classList.remove('fake-fullscreen', 'landscape-fs');
    try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch(e){}
    updateWatchFsBtn();
    return;
  }
  const d = document;
  const getFsEl = () => d.fullscreenElement || d.webkitFullscreenElement || d.mozFullScreenElement || d.msFullscreenElement;
  if (getFsEl()) {
    const exit = d.exitFullscreen || d.webkitExitFullscreen || d.mozCancelFullScreen || d.msExitFullscreen;
    if (exit) { try { exit.call(d); } catch (e) {} }
    return;
  }
  const enableFakeFs = () => {
    el.classList.add('fake-fullscreen');
    el.classList.add('landscape-fs');
    updateWatchFsBtn();
  };
  const req = el.requestFullscreen || el.webkitRequestFullscreen || el.webkitRequestFullScreen;
  if (req) {
    try {
      const p = req.call(el);
      if (p) {
        p.then(() => {
           try { if(screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(()=>{}); } catch(e){}
        }).catch(() => { enableFakeFs(); });
      }
      setTimeout(() => {
        if (!getFsEl() && !el.classList.contains('fake-fullscreen')) { enableFakeFs(); }
      }, 500);
      return;
    } catch (e) {}
  }
  enableFakeFs();
}

function updateWatchFsBtn() {
  const btn = document.querySelector('.watch-fs-btn');
  const el = document.getElementById('watchPlayer');
  if (!btn) return;
  const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement || (el && el.classList.contains('fake-fullscreen')));
  btn.innerHTML = isFs ? ICONS.fullscreenExit : ICONS.fullscreen;
  btn.setAttribute('aria-label', isFs ? '退出全屏' : '全屏');
}
document.addEventListener('fullscreenchange', updateWatchFsBtn);
document.addEventListener('webkitfullscreenchange', updateWatchFsBtn);

async function initStorage(){
  idbDB = await idbOpen();
  if (idbDB && pendingIdbSave) { idbSet(pendingIdbSave.key, pendingIdbSave.val); pendingIdbSave = null; }

  try{
    if (navigator.storage && navigator.storage.persist){
      const persisted = await navigator.storage.persisted();
      if (!persisted) navigator.storage.persist().catch(()=>{});
    }
  }catch(e){}

  let gotFromIDB = false, gotFromLocal = false;

  if (idbDB){
    const raw = await idbGet('libum_data');
    if (raw){
      try{
        const d = JSON.parse(raw);
        let state, savedAt = 0;
        if (d && d.state){ state = unpackAssets(d.state, d.assets); savedAt = d.savedAt || 0; }
        else if (d){ state = d; savedAt = d.__savedAt || 0; }
        if (state){
          S = deepMerge(clone(DEFAULT_STATE), state);
          S.__savedAt = savedAt || Date.now();
          gotFromIDB = true;
        }
      }catch(e){ console.warn('IDB 数据解析失败', e); }
    }
  }

  if (!gotFromIDB){
    try{
      const rawLocal = localStorage.getItem('libum_data');
      if (rawLocal){
        const d = JSON.parse(rawLocal);
        let state, savedAt = 0;
        if (d && d.state){ state = unpackAssets(d.state, d.assets); savedAt = d.savedAt || 0; }
        else if (d){ state = d; savedAt = d.__savedAt || 0; }
        if (state){
          S = deepMerge(clone(DEFAULT_STATE), state);
          S.__savedAt = savedAt || Date.now();
          gotFromLocal = true;
          save(true);
          console.log('已从 localStorage 备份恢复数据');
        }
      }
    }catch(e){ console.warn('localStorage 备份恢复失败', e); }
  }

  try{
    const token = new URLSearchParams(location.search).get('__migrate');
    if (token){
      if (!gotFromIDB && !gotFromLocal){
        const json = decodeToken(token);
        if (json){
          const migrated = JSON.parse(json);
          if (migrated && typeof migrated === 'object'){
            S = deepMerge(clone(DEFAULT_STATE), migrated);
            save(true);
            console.log('已使用安装迁移令牌初始化数据');
          }
        }
      }
      history.replaceState(null, '', location.pathname + location.hash);
    }
  }catch(e){ console.warn('迁移令牌解析失败', e); }

  normalizeState();
  migratePatCards();

  try {
    const queueRaw = await idbGet('libum_queue');
    if (queueRaw) {
      const queue = typeof queueRaw === 'string' ? JSON.parse(queueRaw) : queueRaw;
      if (Array.isArray(queue) && queue.length) {
        queue.forEach(item => {
          if (item.t && item.cid) {
            if (!S.chats[item.cid]) S.chats[item.cid] = [];
            S.chats[item.cid].push({
              id: uid(), from: 'mj', type: 'text',
              text: item.t, time: item.ts || Date.now()
            });
            if (!S.unread.chats[item.cid]) S.unread.chats[item.cid] = 0;
            S.unread.chats[item.cid]++;
          }
        });
        save(true);
        idbDelete('libum_queue');
      }
    }
  } catch(e){ console.warn('SW 队列恢复失败', e); }

  try {
    const fbRaw = await idbGet('libum_notif_fallback');
    if (fbRaw) {
      const fb = typeof fbRaw === 'string' ? JSON.parse(fbRaw) : fbRaw;
      if (fb && Date.now() - fb.ts < 3600000) {
        setTimeout(() => LibumEngine.push(fb.title, fb.body, fb.tag, fb.data, false), 2000);
      }
      idbDelete('libum_notif_fallback');
    }
  } catch(e){}

  if (!S.settings.nextLetterTime) {
    const minH = S.settings.letterMinHours || 2;
    const maxH = S.settings.letterMaxHours || 6;
    S.settings.nextLetterTime = Date.now() + rnd(minH * 3600000, maxH * 3600000);
  }
  S.contacts.forEach(c => {
    const cs = getChatSettings(c.id);
    if (!cs.nextAutoMsgTime) { const unit = cs.autoMsgUnit || 'hours'; const multiplier = unit === 'minutes' ? 60000 : 3600000; cs.nextAutoMsgTime = Date.now() + rnd((cs.autoMsgMin || 2) * multiplier, (cs.autoMsgMax || 6) * multiplier); }
    if (!cs.nextMomentTime) { cs.nextMomentTime = Date.now() + rnd((cs.momentMinHours || 4) * 3600000, (cs.momentMaxHours || 12) * 3600000); }
  });
  if (!S.settings.nextVisitorTime) {
    const vr = visitorIntervalRange();
    S.settings.nextVisitorTime = Date.now() + rnd(vr.minH * 3600000, vr.maxH * 3600000);
  }
  if (S.settings.callEnabled && !S.settings.nextCallTime) {
    const cr = callIntervalRange();
    S.settings.nextCallTime = Date.now() + rnd(cr.minH * 3600000, cr.maxH * 3600000);
  }

  try {
    if ('BroadcastChannel' in window) {
      const syncChannel = new BroadcastChannel('libum-sync');
      let syncLock = false;
      syncChannel.onmessage = async (e) => {
        if (e.data === 'data-updated' && !syncLock) {
          syncLock = true; 
          if (idbDB) {
            const raw = await idbGet('libum_data');
            if (raw) {
              try {
                const d = JSON.parse(raw);
                const state = d.state ? unpackAssets(d.state, d.assets) : d;
                if (state) {
                  S = deepMerge(clone(DEFAULT_STATE), state);
                  normalizeState();
                  lastScrollKey = '';
                  if (document.visibilityState === 'visible') {
                    try { render(); } catch(err) {}
                  }
                }
              } catch(err) {}
            }
          }
          setTimeout(() => { syncLock = false; }, 1000);
        }
      };
      window.__libumSyncChannel = syncChannel;
    }
  } catch(e) { console.warn('BroadcastChannel 初始化失败', e); }

  lastScrollKey = '';
  applySettings();
  render();

  try{
    const mHash = location.hash.match(/chat=([^&]+)/);
    if (mHash && mHash[1]){
      const cid = decodeURIComponent(mHash[1]);
      if (getContact(cid)) {
        setTimeout(() => { go('chatRoom', { id: cid }); }, 300);
        history.replaceState(null, '', location.pathname + location.search);
      }
    }
    
    const urlParams = new URLSearchParams(location.search);
    const pageParam = urlParams.get('page');
    const idParam = urlParams.get('id');
    if (pageParam && VIEWS[pageParam]) {
      setTimeout(() => { 
        if (idParam) go(pageParam, { id: idParam });
        else go(pageParam); 
      }, 300);
      history.replaceState(null, '', location.pathname);
    }
  }catch(e){}

  if (S.settings.keepAlive) {
    setTimeout(() => { if (S.settings.keepAlive) LibumEngine.startKeepAlive(); }, 300);
  }
  setTimeout(() => {
    if (S.settings.pushEnabled) LibumEngine.setPushEnabled(true);
  }, 1000);

  checkBackupTip();
  checkUpdateNotice();

  try{
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches
                       || window.navigator.standalone === true;
    const flag = localStorage.getItem('libum_standalone_flag');
    if (isStandalone && flag !== '1') {
      localStorage.setItem('libum_standalone_flag', '1');
      setTimeout(() => { save(true); }, 800);
      setTimeout(() => { showToast('已作为应用启动，数据已同步'); }, 1400);
    }
  }catch(e){}

  (function ensureNotificationPermission(){
    try{
      if(!('Notification' in window)) return;
      if(Notification.permission === 'granted') return;
      if(Notification.permission === 'denied') return;
      const ask = () => {
        document.removeEventListener('pointerdown', ask);
        document.removeEventListener('click', ask);
        requestNotificationPermission().then(ok => {
          if(ok) showToast('系统通知已开启');
        });
      };
      document.addEventListener('pointerdown', ask, { once: true });
      document.addEventListener('click', ask, { once: true });
    }catch(e){}
  })();
}

initStorage();

function autoStartKeepAlive() {
  if (S.settings.keepAlive) {
    LibumEngine.startKeepAlive();
  }
  document.removeEventListener('pointerdown', autoStartKeepAlive, true);
  document.removeEventListener('click', autoStartKeepAlive, true);
}
document.addEventListener('pointerdown', autoStartKeepAlive, { capture: true });
document.addEventListener('click', autoStartKeepAlive, { capture: true });

function enableKeepAliveNow(){
  keepUserTouched = true;
  LibumEngine.startKeepAlive();
  if('Notification' in window && Notification.permission === 'default'){
    requestNotificationPermission().then(ok => { if(ok) showToast('系统通知已开启'); });
  }
}
function stopKeepAlive(){
  LibumEngine.stopKeepAlive();
}

window.addEventListener('beforeunload', () => { try{ save(true); }catch(e){} });
</script>
</body>
</html>
